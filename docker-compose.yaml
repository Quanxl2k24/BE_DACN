version: "3.8"

services:
  dev-database:
    image: postgres:15.0
    container_name: db_dacn_postgress
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Abc123456789
      POSTGRES_DB: dacndev
    networks:
      - nestjs-networks
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_dacn
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - nestjs-networks

networks:
  nestjs-networks:
    driver: bridge

volumes:
  postgres_data:
  redis_data: